name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Offline only: translation, chunk protocol, model metadata, error classification.
      # The live test (plugin/test/live.mjs) needs a real Antigravity installation and quota.
      - run: node plugin/test/unit.mjs
      - run: node --check plugin/index.mjs
      - run: node --check plugin/client.js
      - run: node --check plugin/src/adapter.mjs
      - run: node --check plugin/src/antigravity.mjs
      - run: node --check plugin/src/errors.mjs
      - run: node --check plugin/src/gemini.mjs
      - run: node --check plugin/src/imagegen.mjs
      - run: node --check plugin/src/status.mjs
      - run: node --check plugin/src/tool.mjs
      - run: node --check tools/apply-profile.mjs
      - run: node --check tools/catalogue.mjs

  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Offline only. test/live.test.ts needs a real Antigravity install and quota.
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-chat-vsix
          path: vscode/antigravity-chat.vsix
